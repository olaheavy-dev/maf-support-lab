name: Learning ticket
description: A small implementation task with sources, verification, and interview outcomes.
title: "[LNN] "
labels: ["type:learning"]
body:
  - type: input
    id: parent
    attributes:
      label: Parent epic and prerequisites
      description: Link the epic and blocking tickets. Set the native relationships too.
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What I will implement
      description: A concrete behavior, boundaries, and expected files. Aim for one focused change.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Course files and official documentation
      description: Exact pinned course links, a Microsoft Learn page, relevant Aspire/GitHub docs, selected package versions, and source role/limitations.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and verification
      description: Observable success, failure paths, commands, and expected evidence.
    validations:
      required: true
  - type: textarea
    id: outcomes
    attributes:
      label: What I should learn
      description: Explain the concepts and tradeoffs this task teaches.
    validations:
      required: true
  - type: textarea
    id: interview
    attributes:
      label: Interview questions and stretch exercise
      description: Two questions to answer aloud and one small modification to attempt independently.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence before closing
      description: PR, tests, trace/screenshot where relevant, own-word explanation, and remaining questions.
    validations:
      required: true
