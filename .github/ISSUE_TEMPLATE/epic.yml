name: Learning epic
description: A demonstrable capability delivered through ordered learning tickets.
title: "[E NN] "
labels: ["type:epic"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Demonstrable outcome and boundaries
    validations:
      required: true
  - type: textarea
    id: children
    attributes:
      label: Ordered sub-issues and exit criteria
      description: Link child issues, add native sub-issues, and state the demonstration that completes this epic.
    validations:
      required: true
