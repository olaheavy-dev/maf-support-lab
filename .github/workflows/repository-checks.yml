name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
jobs:
  planning-and-contracts:
    name: planning-and-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate learning roadmap and repository metadata
        run: python3 scripts/validate_repository.py
      - name: Check planning validation regressions
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install contract test tools (hash-locked)
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts-venv"
          "$RUNNER_TEMP/contracts-venv/bin/pip" install --quiet --require-hashes -r contracts/requirements.txt
      - name: Check support contracts
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" -m unittest discover -s contracts/tests -p "test_*.py"'
      - name: Check synthetic fixtures and scenarios
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" -m unittest discover -s fixtures/tests -p "test_*.py"'

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Offline lane: fake model mode, no provider credentials, locked restore.
      ContinuousIntegrationBuild: "true"
      ModelProvider__Mode: Fake
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore maf-support-lab.slnx
      - name: Build (warnings are errors)
        run: dotnet build maf-support-lab.slnx --no-restore --configuration Release
      - name: Test (fake mode, no credentials)
        run: dotnet test --solution maf-support-lab.slnx --no-build --configuration Release

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Offline lane: fake model mode, no provider credentials, locked environment.
      MODEL_PROVIDER__MODE: fake
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: src/python/uv.lock
      - name: Sync (locked)
        run: uv sync --locked
      - name: Lint (includes the no-.NET-imports rule)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check (strict)
        run: uv run pyright
      - name: Test (fake mode, no credentials)
        run: uv run pytest

  # Cross-backend contract probes (L21): the real .NET and Python servers, fake mode, no credentials, the same requests,
  # schema-validated and compared. Black-box over HTTP; it imports neither backend.
  cross-backend:
    name: cross-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ContinuousIntegrationBuild: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: src/python/uv.lock
      - name: Build the .NET API (locked restore, Release)
        run: |
          dotnet restore src/dotnet/Support.Api
          dotnet build src/dotnet/Support.Api --no-restore --configuration Release
      - name: Sync the Python backend (locked)
        working-directory: src/python
        run: uv sync --locked
      - name: Install contract test tools (hash-locked)
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts-venv"
          "$RUNNER_TEMP/contracts-venv/bin/pip" install --quiet --require-hashes -r contracts/requirements.txt
      - name: Probe both backends and compare
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" contracts/probes/run_probes.py'

  # Browser probes (L22): real Chromium through the relative-URL proxy against both backends (fake mode, no
  # credentials): chat streaming, approve/reject, refresh, disconnect recovery, safe errors, backend binding.
  browser:
    name: browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ContinuousIntegrationBuild: "true"
    defaults:
      run:
        working-directory: frontend/probes
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: src/python/uv.lock
      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: frontend/probes/package-lock.json
      - name: Build the .NET API (locked restore, Release)
        working-directory: .
        run: |
          dotnet restore src/dotnet/Support.Api
          dotnet build src/dotnet/Support.Api --no-restore --configuration Release
      - name: Sync the Python backend (locked)
        working-directory: src/python
        run: uv sync --locked
      - name: Install probe tools (locked) and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser probes against both backends
        run: npx playwright test

  # The single required status check. It always reports, and it passes only when every
  # language job succeeded: a failed, cancelled, or skipped job turns it red.
  repository-checks:
    name: repository-checks
    if: always()
    needs: [planning-and-contracts, dotnet, python, cross-backend, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = {name: job["result"] for name, job in json.load(sys.stdin).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          failed = [name for name, result in results.items() if result != "success"]
          sys.exit(f"Required checks did not succeed: {failed}" if failed else 0)
          '
