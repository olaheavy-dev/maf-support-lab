name: Repository checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true
env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
jobs:
  contracts-and-docs:
    name: contracts-and-docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every relative link, anchor and image in the tracked Markdown, and every docs/ page reachable from
      # docs/README.md. Offline: external links are not fetched.
      - name: Check documentation links
        run: python3 scripts/check_docs_links.py
      - name: Test the documentation link checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Install contract test tools (hash-locked)
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts-venv"
          "$RUNNER_TEMP/contracts-venv/bin/pip" install --quiet --require-hashes -r contracts/requirements.txt
      - name: Check support contracts
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" -m unittest discover -s contracts/tests -p "test_*.py"'
      - name: Check synthetic fixtures and scenarios
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" -m unittest discover -s fixtures/tests -p "test_*.py"'

  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Offline lane: fake model mode, no provider credentials, locked restore.
      ContinuousIntegrationBuild: "true"
      ModelProvider__Mode: Fake
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore (locked)
        run: dotnet restore maf-support-lab.slnx
      - name: Build (warnings are errors)
        run: dotnet build maf-support-lab.slnx --no-restore --configuration Release
      - name: Test (fake mode, no credentials)
        run: dotnet test --solution maf-support-lab.slnx --no-build --configuration Release

  python:
    name: python
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Offline lane: fake model mode, no provider credentials, locked environment.
      MODEL_PROVIDER__MODE: fake
    defaults:
      run:
        working-directory: src/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: src/python/uv.lock
      - name: Sync (locked)
        run: uv sync --locked
      - name: Lint (includes the no-.NET-imports rule)
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check (strict)
        run: uv run pyright
      - name: Test (fake mode, no credentials)
        run: uv run pytest

  # Cross-backend contract probes: the real .NET and Python servers, fake mode, no credentials, the same requests,
  # schema-validated and compared. Black-box over HTTP; it imports neither backend.
  cross-backend:
    name: cross-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ContinuousIntegrationBuild: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install .NET SDK from global.json
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: src/python/uv.lock
      - name: Build the .NET API (locked restore, Release)
        run: |
          dotnet restore src/dotnet/Support.Api
          dotnet build src/dotnet/Support.Api --no-restore --configuration Release
      - name: Sync the Python backend (locked)
        working-directory: src/python
        run: uv sync --locked
      - name: Install contract test tools (hash-locked)
        run: |
          python3 -m venv "$RUNNER_TEMP/contracts-venv"
          "$RUNNER_TEMP/contracts-venv/bin/pip" install --quiet --require-hashes -r contracts/requirements.txt
      - name: Probe both backends and compare
        run: '"$RUNNER_TEMP/contracts-venv/bin/python" contracts/probes/run_probes.py'
      - name: Build the evaluation runner (Release)
        run: dotnet build evaluations/dotnet/Support.Evaluations --configuration Release
      # The runner starts each backend itself (fake mode): a shared store for read-only cases, a fresh store per
      # write case, restarts for restart/resume. Every dataset and split, on both backends; any failure fails the job.
      - name: Evaluate the .NET backend (all datasets)
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- run --backend dotnet --launch --split development,heldout --source-commit "$GITHUB_SHA"
      - name: Evaluate the Python backend (all datasets)
        if: always()
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- run --backend python --launch --split development,heldout --source-commit "$GITHUB_SHA"
      - name: Native .NET evaluation of the recorded conversations (no model calls)
        if: always()
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- native evaluate
      # Fault and bounded-load scenarios on both backends (fake mode). The checks are correctness only (no cross-
      # conversation leakage, one turn per client_turn_id, 409 while a turn runs, one write per approval, one winner per
      # decision race, failures contained), so they gate; the latency and throughput numbers are recorded, never gated.
      - name: Fault and bounded-load scenarios (.NET)
        if: always()
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- load --backend dotnet --source-commit "$GITHUB_SHA"
      - name: Fault and bounded-load scenarios (Python)
        if: always()
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- load --backend python --source-commit "$GITHUB_SHA"
      - name: Compare the backends
        if: always()
        run: dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- compare --results evaluations/results --out evaluations/results/comparison.md
      # The report. It reads the result documents above and renders them with Microsoft's aieval tool (pinned in
      # .config/dotnet-tools.json); it starts no backend, agent, or judge. One execution name per CI attempt.
      - name: Build the evaluation report (no model calls)
        if: always()
        env:
          DOTNET_AIEVAL_TELEMETRY_OPTOUT: "1"
        run: |
          dotnet tool restore
          dotnet run --project evaluations/dotnet/Support.Evaluations -c Release --no-build -- report --results evaluations/results --store evaluations/results/report/store --execution "ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          dotnet tool run aieval report --path evaluations/results/report/store --output evaluations/results/report/report.html
          dotnet tool run aieval report --path evaluations/results/report/store --output evaluations/results/report/report.json --format json
      - name: Upload the evaluation results and comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evaluation-results
          path: evaluations/results/
          if-no-files-found: warn
          retention-days: 14

  # Evaluation tooling: the Python evaluation package's lint, types and tests (datasets and result contracts).
  # The .NET evaluation project and its tests are part of the solution, so the dotnet job builds and tests them.
  evaluations:
    name: evaluations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: evaluations/python
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
          python-version: "3.15.2"
          enable-cache: true
          cache-dependency-glob: evaluations/python/uv.lock
      - name: Sync (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      - name: Type check (strict)
        run: uv run pyright
      - name: Dataset and result contract tests
        run: uv run pytest
      - name: Validate every dataset
        run: uv run python -m support_evaluations validate
      - name: Native Python evaluation of the recorded conversations (no model calls)
        run: uv run python -m support_evaluations native evaluate
      - name: Native Python workflow evaluation (the scripted agent)
        run: uv run python -m support_evaluations native workflow

  # The demo frontend (Next.js, from house-template-nextjs): the template's own checks. The end-to-end tests run
  # against the production build with Chromium in Playwright's Linux image, which also compares the screenshots.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      # Corepack no longer ships with Node (from 25), so pnpm comes from its own action, at the version
      # frontend/package.json pins in "packageManager".
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: frontend/package.json
      - name: Install (locked)
        run: pnpm install --frozen-lockfile
      - name: Peer dependencies
        run: pnpm peers check
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Type check
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: End-to-end tests (Playwright's Linux image, axe, screenshots)
        run: pnpm e2e:docker

  # The single required status check. It always reports, and it passes only when every
  # language job succeeded: a failed, cancelled, or skipped job turns it red.
  repository-checks:
    name: repository-checks
    if: always()
    needs: [contracts-and-docs, dotnet, python, cross-backend, evaluations, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python3 -c '
          import json, sys
          results = {name: job["result"] for name, job in json.load(sys.stdin).items()}
          for name, result in sorted(results.items()):
              print(f"{name}: {result}")
          failed = [name for name, result in results.items() if result != "success"]
          sys.exit(f"Required checks did not succeed: {failed}" if failed else 0)
          '
