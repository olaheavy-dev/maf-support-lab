version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    # Central versions live in /Directory.Packages.props; lock files are refreshed with each update.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      agents-and-ai:
        patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*", "Anthropic"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      tests:
        patterns: ["xunit*"]
    ignore:
      # Held at 10.x while Microsoft Agent Framework (1.28) depends on Microsoft.Extensions.AI 10.11: moving the family
      # ahead of the framework risks a mismatch (owner's decision, 2026-11-12; see docs/decisions/0001). Remove this when
      # an Agent Framework release depends on 11.x, and move the framework and the family together.
      - dependency-name: "Microsoft.Extensions.AI*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Http.Resilience"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.ServiceDiscovery"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.TimeProvider.Testing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "microsoft.extensions.ai.evaluation.console"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: dotnet-sdk
    # The SDK pinned in /global.json. Runtime moves (a new major) stay deliberate, reviewed changes.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: uv
    # The Python backend: pyproject.toml plus uv.lock; Dependabot updates both together.
    directory: /src/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      agent-framework:
        patterns: ["agent-framework*", "anthropic"]
      web:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*"]
      dev-tools:
        dependency-type: development
  - package-ecosystem: uv
    # Evaluation tooling: its own manifest, never the backend's.
    directory: /evaluations/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    # The demo frontend (pnpm; Dependabot updates package.json and pnpm-lock.yaml together).
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # The OpenTelemetry packages must move together (their peer ranges are tied; `pnpm peers check`
      # fails on a partial update), so they get one group across every update type, ahead of the others.
      opentelemetry:
        patterns: ["@opentelemetry/*", "@vercel/otel"]
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    # Held majors (checked 2026-11-12). Each waits for its ecosystem; the weekly maintenance routine re-checks
    # the conditions and removes a rule once it holds, then takes the upgrade as a reviewed PR.
    ignore:
      # typescript-eslint 8.72.2 supports TypeScript <6.1.0. Remove when it accepts 7.
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # eslint-config-next's plugins (eslint-plugin-react, jsx-a11y, import) support up to ESLint 9. Remove when
      # they accept 10.
      - dependency-name: "eslint"
        versions: [">=10.0.0"]
      # @vercel/otel 2.3.0 requires the OpenTelemetry SDK packages below these versions, and sdk-trace-base has
      # no 3.x yet. Remove when @vercel/otel's peer ranges include them.
      - dependency-name: "@opentelemetry/api"
        versions: [">=1.10.0"] # the 2.x SDK packages require api <1.10.0; it moves with SDK 3
      - dependency-name: "@opentelemetry/resources"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-metrics"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-trace-base"
        versions: [">=3.0.0"]
      - dependency-name: "@opentelemetry/sdk-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/api-logs"
        versions: [">=0.300.0"]
      - dependency-name: "@opentelemetry/instrumentation"
        versions: [">=0.300.0"]
