version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /contracts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: nuget
    # Central versions live in /Directory.Packages.props; lock files are refreshed with each update.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      aspire:
        patterns: ["Aspire.*"]
      opentelemetry:
        patterns: ["OpenTelemetry*"]
      agents-and-ai:
        patterns: ["Microsoft.Agents.*", "Microsoft.Extensions.AI*", "Anthropic"]
      microsoft-extensions:
        patterns: ["Microsoft.Extensions.*", "Microsoft.AspNetCore.*"]
      tests:
        patterns: ["xunit*"]
  - package-ecosystem: uv
    # The Python backend (L17): pyproject.toml plus uv.lock; Dependabot updates both together.
    directory: /src/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      agent-framework:
        patterns: ["agent-framework*", "anthropic"]
      web:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*"]
      dev-tools:
        dependency-type: development
# Add frontend updates when its manifest is introduced.
  - package-ecosystem: npm
    # Browser probes (L22): Playwright only; the proxy and page have no packages.
    directory: /frontend/probes
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
