# CodeQL configuration for .github/workflows/codeql.yml.
name: maf-support-lab
paths-ignore:
  # Build output, including source-generated code (for example the regex generator's RegexGenerator.g.cs).
  # Effective because C# is analyzed with build-mode none, which reads the source tree instead of a build.
  - "**/bin/**"
  - "**/obj/**"
query-filters:
  # cs/path-combine warns that Path.Combine drops earlier parts when a later part is absolute. Every call here joins
  # the repository root or a temp folder with constant relative names (fixtures, schemas, datasets, stores), so the
  # notes were all the same non-issue; triaged and excluded instead of dismissed one by one.
  - exclude:
      id: cs/path-combine
