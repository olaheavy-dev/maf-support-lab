# pnpm settings (https://pnpm.io/supply-chain-security). Install scripts run only for packages
# listed here as true: sharp and unrs-resolver ship prebuilt binaries, so neither needs one.
# pnpm refuses versions published in the last 7 days (minimumReleaseAge, in minutes: 10080; the default is
# 1440), for direct and transitive dependencies. Why: on 17 Nov 2026 malicious agent-framework 1.26.1 and
# 1.26.2 reached PyPI and were pulled within hours; this keeps the same kind of release out of the npm lock,
# matching uv and Dependabot (docs/version-policy.md). To let an urgent security fix through, list the package
# (or one version, e.g. "pkg@1.2.3") under minimumReleaseAgeExclude and say why in the pull request.
# https://pnpm.io/settings/dependency-resolution
minimumReleaseAge: 10080
# Strict (the default once minimumReleaseAge is set explicitly, written out so it is visible): a too-new version
# fails resolution instead of silently falling back to an older one.
minimumReleaseAgeStrict: true
allowBuilds:
  sharp: false
  unrs-resolver: false

# GHSA-g3hv-75wg-m249 (minimatch >=7.0.0 <11.0.1, moderate): typescript-eslint, a lint tool only, still
# depends on minimatch ^10 in its latest release, so no update can fix it. Pin the affected range to the
# patched major; lint and the type check pass with it. Remove when typescript-eslint depends on >=11.0.1.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "11.0.8"

# openapi-typescript 7.13.0 (its latest) still declares typescript ^5. On TypeScript 6 it generates
# src/lib/api/schema.d.ts byte-identically, and CI regenerates and diffs that file on every run, so a real
# incompatibility can't slip through. Remove when openapi-typescript's range includes 6.
peerDependencyRules:
  allowedVersions:
    "openapi-typescript>typescript": "6"
