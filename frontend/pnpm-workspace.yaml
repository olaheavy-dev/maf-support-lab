# pnpm settings (https://pnpm.io/supply-chain-security). Install scripts run only for packages
# listed here as true: sharp and unrs-resolver ship prebuilt binaries, so neither needs one.
# pnpm also holds back versions published in the last day (minimumReleaseAge, default 1440
# minutes), and Dependabot waits seven days before proposing an update.
allowBuilds:
  sharp: false
  unrs-resolver: false

# GHSA-g3hv-75wg-m249 (minimatch >=7.0.0 <11.0.1, moderate): typescript-eslint, a lint tool only, still
# depends on minimatch ^10 in its latest release, so no update can fix it. Pin the affected range to the
# patched major; lint and the type check pass with it. Remove when typescript-eslint depends on >=11.0.1.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "11.0.8"
